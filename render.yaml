services:
  - type: web
    name: oggy-dumper
    runtime: python
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python oggy_dumper.py
    envVars:
      - key: PORT
        generateValue: false   # Render injects PORT automatically; leave blank to use default
    disk:
      name: oggy-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
